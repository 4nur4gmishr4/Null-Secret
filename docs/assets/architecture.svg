<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
    text { font-family: 'Inter', system-ui, sans-serif; fill: #FAFAFA; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .bg { fill: #0A0A0A; }
    .card { fill: #111111; stroke: #1F1F1F; stroke-width: 1; }
    .card-elevated { fill: #1A1A1A; stroke: #333333; stroke-width: 1; }
    .text-primary { fill: #FAFAFA; font-weight: 600; font-size: 16px; }
    .text-secondary { fill: #A1A1A1; font-size: 13px; }
    .text-tertiary { fill: #6B6B6B; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    
    .dashed-path { fill: none; stroke: #333333; stroke-width: 1.5; stroke-dasharray: 4; }
    .packet { fill: #FAFAFA; animation: flow 3s linear infinite; }
    .glow-pulse { animation: glow 2s ease-in-out infinite alternate; }

    @keyframes flow {
      0% { offset-distance: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes glow { 0% { stroke: #1F1F1F; } 100% { stroke: #6B6B6B; } }
  </style>

  <rect class="bg" width="800" height="400" />

  <text x="400" y="40" text-anchor="middle" class="text-tertiary" font-size="14">System Topology</text>

  <!-- Client Side -->
  <rect class="card" x="60" y="80" width="240" height="260" />
  <rect class="bg" x="60" y="80" width="240" height="40" stroke="#1F1F1F" stroke-width="1" />
  <text x="180" y="105" text-anchor="middle" class="text-primary">Browser (Client)</text>

  <rect class="card-elevated" x="80" y="140" width="200" height="40" />
  <text x="180" y="165" text-anchor="middle" class="text-secondary mono">React 19 + Vite</text>

  <rect class="card-elevated" x="80" y="200" width="200" height="40" />
  <text x="180" y="225" text-anchor="middle" class="text-secondary mono">Firebase Auth SDK</text>
  
  <rect class="card-elevated glow-pulse" x="80" y="260" width="200" height="40" />
  <text x="180" y="285" text-anchor="middle" class="text-secondary mono">Web Crypto API</text>

  <!-- Server Side -->
  <rect class="card" x="500" y="80" width="240" height="260" />
  <rect class="bg" x="500" y="80" width="240" height="40" stroke="#1F1F1F" stroke-width="1" />
  <text x="620" y="105" text-anchor="middle" class="text-primary">Server &amp; Storage</text>

  <rect class="card-elevated" x="520" y="140" width="200" height="40" />
  <text x="620" y="165" text-anchor="middle" class="text-secondary mono">Go API (:8080)</text>

  <rect class="card-elevated" x="520" y="200" width="200" height="40" />
  <text x="620" y="225" text-anchor="middle" class="text-secondary mono">SQLite (WAL Mode)</text>

  <rect class="card-elevated glow-pulse" x="520" y="260" width="200" height="40" />
  <text x="620" y="285" text-anchor="middle" class="text-secondary mono">Firebase Admin</text>

  <!-- Connections -->
  <!-- HTTPS Data Flow -->
  <path id="https-path" class="dashed-path" d="M 300 160 L 500 160" />
  <circle r="4" class="packet">
    <animateMotion dur="2s" repeatCount="indefinite">
      <mpath href="#https-path"/>
    </animateMotion>
  </circle>
  <text x="400" y="150" text-anchor="middle" class="text-tertiary">HTTPS (JSON payload)</text>

  <!-- Key URL Fragment (Crossed out) -->
  <path class="dashed-path" d="M 300 280 L 500 280" />
  <!-- Red Cross -->
  <path d="M 395 275 L 405 285 M 405 275 L 395 285" fill="none" stroke="#F87171" stroke-width="2" />
  <text x="400" y="270" text-anchor="middle" class="text-tertiary" fill="#F87171">Decryption Key Never Sent</text>
  <text x="400" y="300" text-anchor="middle" class="text-secondary mono" font-size="10">URL Fragment (#key)</text>
</svg>
