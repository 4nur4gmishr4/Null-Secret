<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
    text { font-family: 'Inter', system-ui, sans-serif; fill: #FAFAFA; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .bg { fill: #0A0A0A; }
    .card { fill: #111111; stroke: #1F1F1F; stroke-width: 1; }
    .card-elevated { fill: #1A1A1A; stroke: #333333; stroke-width: 1; }
    .text-primary { fill: #FAFAFA; font-weight: 600; font-size: 16px; }
    .text-secondary { fill: #A1A1A1; font-size: 13px; }
    .text-tertiary { fill: #6B6B6B; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    
    .icon { fill: none; stroke: #FAFAFA; stroke-width: 1.5; stroke-linecap: square; stroke-linejoin: miter; }
    .icon-filled { fill: #FAFAFA; }
    
    .hover-lift { transition: transform 0.3s ease, stroke 0.3s ease; }
    .hover-lift:hover { transform: translateY(-4px); stroke: #6B6B6B; }
  </style>

  <rect class="bg" width="800" height="400" />
  <text x="400" y="40" text-anchor="middle" class="text-tertiary" font-size="14">Core Platform Features</text>

  <!-- Feature 1: Zero Knowledge -->
  <g class="hover-lift">
    <rect class="card" x="60" y="80" width="210" height="130" />
    <g transform="translate(90, 110)">
      <!-- Shield Icon -->
      <path d="M-10,-12 L0,-16 L10,-12 L10,0 C10,10 0,16 0,16 C0,16 -10,10 -10,0 Z" class="icon" />
      <path d="M-4,0 L-1,3 L4,-2" class="icon" />
    </g>
    <text x="120" y="115" class="text-primary">Zero-Knowledge</text>
    <text x="80" y="150" class="text-secondary">Keys never leave your</text>
    <text x="80" y="170" class="text-secondary">browser environment.</text>
  </g>

  <!-- Feature 2: Self Destruct -->
  <g class="hover-lift">
    <rect class="card" x="295" y="80" width="210" height="130" />
    <g transform="translate(325, 110)">
      <!-- Flame/Burn Icon -->
      <path d="M0,12 C-8,12 -12,4 -8,-4 C-6,-8 -2,-12 0,-16 C2,-12 6,-8 8,-4 C12,4 8,12 0,12 Z" class="icon" />
      <path d="M0,12 C-4,12 -6,8 -4,4 C-2,0 0,-4 0,-4 C0,-4 2,0 4,4 C6,8 4,12 0,12 Z" class="icon" />
    </g>
    <text x="355" y="115" class="text-primary">Self-Destruct</text>
    <text x="315" y="150" class="text-secondary">Burns on view or</text>
    <text x="315" y="170" class="text-secondary">after expiration.</text>
  </g>

  <!-- Feature 3: File Attachments -->
  <g class="hover-lift">
    <rect class="card" x="530" y="80" width="210" height="130" />
    <g transform="translate(560, 110)">
      <!-- Paperclip Icon -->
      <path d="M-4,-6 L-4,6 C-4,9 0,9 0,6 L0,-8 C0,-12 6,-12 6,-8 L6,6 C6,12 -8,12 -8,6 L-8,-6" class="icon" />
    </g>
    <text x="590" y="115" class="text-primary">File Attachments</text>
    <text x="550" y="150" class="text-secondary">Attach files up to</text>
    <text x="550" y="170" class="text-secondary mono">30MB combined size.</text>
  </g>

  <!-- Feature 4: Access Control -->
  <g class="hover-lift">
    <rect class="card" x="60" y="230" width="327" height="130" />
    <g transform="translate(90, 260)">
      <!-- Lock/Key Icon -->
      <rect x="-8" y="-2" width="16" height="12" class="icon" />
      <path d="M-4,-2 L-4,-6 C-4,-8 4,-8 4,-6 L4,-2" class="icon" />
      <circle cx="0" cy="4" r="1.5" class="icon-filled" />
    </g>
    <text x="120" y="265" class="text-primary">Access Control</text>
    <text x="80" y="300" class="text-secondary">Protect shareable links</text>
    <text x="80" y="320" class="text-secondary">with an additional password.</text>
  </g>

  <!-- Feature 5: Auditing -->
  <g class="hover-lift">
    <rect class="card" x="413" y="230" width="327" height="130" />
    <g transform="translate(443, 260)">
      <!-- Log/List Icon -->
      <rect x="-10" y="-12" width="20" height="24" class="icon" />
      <line x1="-5" y1="-6" x2="5" y2="-6" class="icon" />
      <line x1="-5" y1="0" x2="5" y2="0" class="icon" />
      <line x1="-5" y1="6" x2="2" y2="6" class="icon" />
    </g>
    <text x="473" y="265" class="text-primary">Firebase Auditing</text>
    <text x="433" y="300" class="text-secondary">Detailed history logs of when</text>
    <text x="433" y="320" class="text-secondary">secrets were viewed/destroyed.</text>
  </g>

</svg>
