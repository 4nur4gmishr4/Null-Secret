<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
    text { font-family: 'Inter', system-ui, sans-serif; fill: #FAFAFA; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .bg { fill: #0A0A0A; }
    .card { fill: #111111; stroke: #1F1F1F; stroke-width: 1; }
    
    .text-primary { fill: #FAFAFA; font-weight: 700; font-size: 20px; letter-spacing: 1px; }
    .text-secondary { fill: #A1A1A1; font-size: 14px; }
    .text-tertiary { fill: #6B6B6B; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    .text-danger { fill: #F87171; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    
    .icon { fill: none; stroke: #F87171; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; }
    .pulse-glow { animation: red-glow 3s infinite alternate ease-in-out; }
    
    @keyframes red-glow { 0% { stroke: #1F1F1F; } 100% { stroke: #F87171; } }
  </style>

  <rect class="bg" width="800" height="240" />

  <rect class="card pulse-glow" x="100" y="40" width="600" height="160" />
  
  <g transform="translate(140, 120)">
    <!-- Shield / Copyright Icon -->
    <path d="M0,-24 L20,-16 L20,4 C20,16 0,24 0,24 C0,24 -20,16 -20,4 L-20,-16 Z" class="icon" />
    <text x="0" y="4" class="text-danger" text-anchor="middle" font-size="14">©</text>
  </g>

  <text x="200" y="90" class="text-tertiary">License Status</text>
  <text x="200" y="120" class="text-primary">PROPRIETARY SOFTWARE</text>
  <text x="200" y="145" class="text-secondary mono">Copyright © 2026 Anurag Mishra.</text>
  <text x="200" y="165" class="text-secondary mono">All Rights Reserved. No Open Source Distribution.</text>

</svg>
