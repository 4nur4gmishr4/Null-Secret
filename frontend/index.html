<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <meta name="description"
    content="Null-Secret — zero-knowledge, end-to-end encrypted secret sharing. Your messages are encrypted in the browser and never touch our server." />
  <meta property="og:title" content="Null-Secret" />
  <meta property="og:description" content="Zero-knowledge, end-to-end encrypted secret sharing. Messages encrypted in your browser." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Null-Secret" />
  <meta name="twitter:description" content="Zero-knowledge secret sharing. Encrypted in your browser, never on our server." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <title>Null-Secret</title>
  <script>
    // Apply theme before React hydration to prevent a white-flash (FOUC)
    // when dark mode is active. Must mirror the key used in ThemeContext.tsx.
    try {
      var t = localStorage.getItem('theme-preference');
      if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
</head>

<body>
  <div id="root"></div>
  <noscript>Null-Secret requires JavaScript. Enable JavaScript to create and read secrets.</noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
